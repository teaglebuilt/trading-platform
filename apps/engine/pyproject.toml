[project]
name = "strategy-engine"
version = "0.1.0"
description = "Wrapper/orchestrator for trading strategies (Freqtrade/Jesse/Backtrader + local)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "typing-extensions>=4.12",
]

[tool.uv.sources]
# Resolve these as workspace packages when available
common = { workspace = true }
risk = { workspace = true }

[project.scripts]
strategy-engine = "strategy_engine.service:cli"
