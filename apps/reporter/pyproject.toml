[project]
name = "reporter"
version = "0.1.0"
description = "Reporting and alerting service for trading performance"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "redis>=5.0",
  "duckdb>=1.1.0",
  "httpx>=0.27",
]

[tool.uv.sources]
common = { workspace = true }

[project.scripts]
reporter = "reporter.service:main"
