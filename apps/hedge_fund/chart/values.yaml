# Default values for trading-agents helm chart

# Alpaca API credentials
# IMPORTANT: Override these values during installation
# Example: helm install trading-agents ./chart --set alpaca.apiKey=xxx --set alpaca.secretKey=yyy

alpaca:
  apiKey: ${ALPACA_API_KEY}
  secretKey: ${ALPACA_SECRET_KEY}
  paperTrade: "True"

# Agent configurations
agents:
  marketAnalyst:
    enabled: true

  strategyAgent:
    enabled: true

  positionSizer:
    enabled: true

  timingAgent:
    enabled: true

  governanceAgent:
    enabled: true
